<style>
/* ---------- Intro: calendario en perspectiva ---------- */
#intro-cal {
  position: fixed; inset: 0; z-index: 60; background: #000; overflow: hidden;
  /* Red de seguridad: si el script fallara, el telón se retira solo a los 16 s */
  animation: introFailsafe .01s linear 16s forwards;
}
@keyframes introFailsafe { to { visibility: hidden; pointer-events: none; } }
#intro-cal.leaving { transition: opacity 1.1s ease; opacity: 0; pointer-events: none; }
#intro-cal.gone { display: none; }
.cal-world {
  position: absolute; inset: 0; perspective: 900px; perspective-origin: 50% 42%;
  --cell: clamp(92px, 22.4vmin, 184px);
}
.cal-rig { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.cal-sheet {
  position: absolute; transform-style: preserve-3d;
  padding: calc(var(--cell) * .5) calc(var(--cell) * .45);
  background: linear-gradient(160deg, #2a0b17 0%, #14060d 70%);
  border: 1px solid rgba(212,175,55,.35); border-radius: 10px;
  box-shadow: 0 60px 120px rgba(0,0,0,.9), 0 0 0 1px rgba(255,182,193,.06) inset;
}
.cal-month {
  font-family: 'Cinzel', serif; font-weight: 700; color: var(--gold-light);
  font-size: calc(var(--cell) * .62); letter-spacing: .14em; text-align: center;
  margin-bottom: calc(var(--cell) * .3); text-shadow: 0 4px 18px rgba(0,0,0,.8);
  transform: translateZ(calc(var(--cell) * .15));
  height: calc(var(--cell) * 1.45); display: flex; align-items: center; justify-content: center; line-height: 1.12; overflow: visible;
}
.cal-days { display: grid; grid-template-columns: repeat(7, var(--cell)); grid-auto-rows: var(--cell); gap: calc(var(--cell) * .08); transform-style: preserve-3d; }
.cal-dow-i { display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .24); color: rgba(255,245,233,.5); letter-spacing: .08em; }
.cal-cell {
  position: relative; display: flex; align-items: center; justify-content: center;
  border-radius: calc(var(--cell) * .09); background: linear-gradient(180deg, rgba(255,245,233,.07), rgba(255,245,233,.02));
  box-shadow: 0 calc(var(--cell) * .12) calc(var(--cell) * .2) rgba(0,0,0,.55), 0 0 0 1px rgba(255,245,233,.06) inset;
  transform: translateZ(calc(var(--cell) * .12)); transform-style: preserve-3d;
}
.cal-cell span {
  font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: calc(var(--cell) * .46);
  color: rgba(255,245,233,.82); transform: translateZ(calc(var(--cell) * .22)); text-shadow: 0 6px 10px rgba(0,0,0,.7);
}
.cal-cell.empty { background: none; box-shadow: none; }
.cal-cell.out { opacity: .42; }
.cal-cell .cal-mn { position: absolute; top: 6%; left: 9%; font: 600 calc(var(--cell) * .17) 'Montserrat', sans-serif; letter-spacing: .1em; color: rgba(247,226,156,.8); transform: translateZ(calc(var(--cell) * .22)); }
.cal-cell.mark span { color: var(--gold-light); }
/* Días que se van sombreando (clip, clip, clip…) hasta llegar a hoy */
.cal-cell.past { background: linear-gradient(180deg, rgba(212,175,55,.34), rgba(122,10,42,.55)); box-shadow: 0 0 0 1px rgba(212,175,55,.45) inset, 0 calc(var(--cell) * .12) calc(var(--cell) * .2) rgba(0,0,0,.55); animation: calClip .38s var(--ease-cine); }
.cal-cell.past span { color: rgba(255,226,160,.95); }
.cal-cell.past::before { content: ''; position: absolute; left: 14%; right: 14%; top: 50%; height: calc(var(--cell) * .035); background: rgba(247,226,156,.75); transform: rotate(-18deg); border-radius: 2px; }
@keyframes calClip { 0% { filter: brightness(2.2); transform: translateZ(calc(var(--cell) * .12)) scale(1.18); } 100% { filter: brightness(1); transform: translateZ(calc(var(--cell) * .12)) scale(1); } }
.cal-cell.target {
  background: radial-gradient(circle at 50% 40%, rgba(255,214,236,.95), rgba(220,20,60,.85) 62%, rgba(122,10,42,.95));
  box-shadow: 0 0 0 calc(var(--cell) * .03) var(--gold), 0 0 calc(var(--cell) * .6) rgba(255,90,140,.9), 0 calc(var(--cell) * .2) calc(var(--cell) * .4) rgba(0,0,0,.6);
  transform: translateZ(calc(var(--cell) * .5));
}
.cal-cell.target span { color: #fff; transform: translateZ(calc(var(--cell) * .12)); text-shadow: 0 2px 12px rgba(120,0,40,.9); }
.cal-cell.target::after {
  content: ''; position: absolute; inset: -22%; border-radius: 50%; pointer-events: none;
  border: calc(var(--cell) * .03) solid rgba(255,214,236,.8); opacity: 0; transform: translateZ(calc(var(--cell) * .5)) scale(.7);
}
.cal-rig.lit .cal-cell.target::after { animation: calPulse 1.5s ease-out infinite; }
@keyframes calPulse { 0% { opacity: .9; transform: translateZ(calc(var(--cell) * .5)) scale(.7);} 100% { opacity: 0; transform: translateZ(calc(var(--cell) * .5)) scale(1.9);} }
#intro-cal .cal-flash { position: absolute; inset: 0; background: radial-gradient(circle, #fff 0%, #ffd6ec 40%, transparent 75%); opacity: 0; pointer-events: none; }
#intro-cal .cal-fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
#intro-cal .cal-vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75) 100%); }
#intro-skip {
  position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); z-index: 2;
  background: rgba(255,255,255,.08); color: var(--ivory); border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
  padding: .55rem 1rem; font: 500 .74rem 'Montserrat', sans-serif; letter-spacing: .08em; cursor: pointer; backdrop-filter: blur(6px);
}
#intro-skip:focus-visible, .r12-btn:focus-visible, #lock12 button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }

</style>
